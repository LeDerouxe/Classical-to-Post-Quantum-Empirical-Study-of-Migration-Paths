<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
<title id="title">TLS handshake communication overhead by configuration</title>
<desc id="desc">Client-side TCP_INFO median handshake bytes and packet counts for S0, S2, S3, and S4.</desc>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#111827}.small{font-size:13px}.label{font-size:16px}.title{font-size:20px;font-weight:600}.axis{stroke:#6b7280;stroke-width:1}.grid{stroke:#d1d5db;stroke-width:1}</style>
<text x="95" y="32" class="title">TLS 1.3 communication overhead</text>
<text x="95" y="53" class="small">Client-side TCP_INFO at SSL_connect completion; n = 150 per configuration</text>
<text x="95" y="90" class="label">Handshake bytes</text>
<line x1="153.0" y1="112" x2="153.0" y2="415" class="grid"/>
<text x="153.0" y="437" text-anchor="middle" class="small">0</text>
<line x1="228.5" y1="112" x2="228.5" y2="415" class="grid"/>
<text x="228.5" y="437" text-anchor="middle" class="small">3,000</text>
<line x1="304.0" y1="112" x2="304.0" y2="415" class="grid"/>
<text x="304.0" y="437" text-anchor="middle" class="small">6,000</text>
<line x1="379.5" y1="112" x2="379.5" y2="415" class="grid"/>
<text x="379.5" y="437" text-anchor="middle" class="small">9,000</text>
<line x1="455.0" y1="112" x2="455.0" y2="415" class="grid"/>
<text x="455.0" y="437" text-anchor="middle" class="small">12,000</text>
<text x="142" y="150" text-anchor="end" class="small">S0</text>
<rect x="153" y="135" width="24.3" height="25" fill="#1f2937"/>
<text x="185.3" y="152" class="small">967</text>
<text x="142" y="213" text-anchor="end" class="small">S2</text>
<rect x="153" y="198" width="81.3" height="25" fill="#0072B2"/>
<text x="242.3" y="215" class="small">3,231</text>
<text x="142" y="276" text-anchor="end" class="small">S3</text>
<rect x="153" y="261" width="291.8" height="25" fill="#D55E00"/>
<text x="451.0" y="278" class="small">11,595</text>
<text x="142" y="339" text-anchor="end" class="small">S4</text>
<rect x="153" y="324" width="290.2" height="25" fill="#009E73"/>
<text x="451.0" y="341" class="small">11,531</text>
<text x="545" y="90" class="label">TCP segments</text>
<line x1="603.0" y1="112" x2="603.0" y2="415" class="grid"/>
<text x="603.0" y="437" text-anchor="middle" class="small">0</text>
<line x1="663.5" y1="112" x2="663.5" y2="415" class="grid"/>
<text x="663.5" y="437" text-anchor="middle" class="small">3</text>
<line x1="724.0" y1="112" x2="724.0" y2="415" class="grid"/>
<text x="724.0" y="437" text-anchor="middle" class="small">7</text>
<line x1="784.5" y1="112" x2="784.5" y2="415" class="grid"/>
<text x="784.5" y="437" text-anchor="middle" class="small">10</text>
<line x1="845.0" y1="112" x2="845.0" y2="415" class="grid"/>
<text x="845.0" y="437" text-anchor="middle" class="small">14</text>
<text x="592" y="150" text-anchor="end" class="small">S0</text>
<rect x="603" y="135" width="138.3" height="25" fill="#1f2937"/>
<text x="749.3" y="152" class="small">8</text>
<text x="592" y="213" text-anchor="end" class="small">S2</text>
<rect x="603" y="198" width="138.3" height="25" fill="#0072B2"/>
<text x="749.3" y="215" class="small">8</text>
<text x="592" y="276" text-anchor="end" class="small">S3</text>
<rect x="603" y="261" width="207.4" height="25" fill="#D55E00"/>
<text x="818.4" y="278" class="small">12</text>
<text x="592" y="339" text-anchor="end" class="small">S4</text>
<rect x="603" y="324" width="207.4" height="25" fill="#009E73"/>
<text x="818.4" y="341" class="small">12</text>
</svg>
