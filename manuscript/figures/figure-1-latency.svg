<svg xmlns="http://www.w3.org/2000/svg" width="920" height="390" viewBox="0 0 920 390" role="img" aria-labelledby="title desc">
<title id="title">TLS handshake latency by cryptographic configuration</title>
<desc id="desc">Medians and batch-aware 95 percent bootstrap confidence intervals for S0, S2, S3, and S4.</desc>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#111827}.small{font-size:13px}.label{font-size:16px}.title{font-size:20px;font-weight:600}.axis{stroke:#6b7280;stroke-width:1}.grid{stroke:#d1d5db;stroke-width:1}</style>
<text x="145" y="32" class="title">TLS 1.3 handshake latency</text>
<text x="145" y="53" class="small">Median and batch-aware 95% bootstrap confidence interval; n = 150 per configuration</text>
<line x1="145.0" y1="70" x2="145.0" y2="325" class="grid"/>
<text x="145.0" y="349" text-anchor="middle" class="small">0.0</text>
<line x1="235.0" y1="70" x2="235.0" y2="325" class="grid"/>
<text x="235.0" y="349" text-anchor="middle" class="small">0.2</text>
<line x1="325.0" y1="70" x2="325.0" y2="325" class="grid"/>
<text x="325.0" y="349" text-anchor="middle" class="small">0.4</text>
<line x1="415.0" y1="70" x2="415.0" y2="325" class="grid"/>
<text x="415.0" y="349" text-anchor="middle" class="small">0.6</text>
<line x1="505.0" y1="70" x2="505.0" y2="325" class="grid"/>
<text x="505.0" y="349" text-anchor="middle" class="small">0.8</text>
<line x1="595.0" y1="70" x2="595.0" y2="325" class="grid"/>
<text x="595.0" y="349" text-anchor="middle" class="small">1.0</text>
<line x1="685.0" y1="70" x2="685.0" y2="325" class="grid"/>
<text x="685.0" y="349" text-anchor="middle" class="small">1.2</text>
<line x1="775.0" y1="70" x2="775.0" y2="325" class="grid"/>
<text x="775.0" y="349" text-anchor="middle" class="small">1.4</text>
<line x1="865.0" y1="70" x2="865.0" y2="325" class="grid"/>
<text x="865.0" y="349" text-anchor="middle" class="small">1.6</text>
<line x1="145" y1="325" x2="865" y2="325" class="axis"/>
<text x="505.0" y="376" text-anchor="middle" class="label">Client SSL_connect duration (ms)</text>
<text x="127" y="123" text-anchor="end" class="label">S0</text>
<line x1="510.4" y1="118" x2="533.9" y2="118" stroke="#1f2937" stroke-width="3"/>
<line x1="510.4" y1="110" x2="510.4" y2="126" stroke="#1f2937" stroke-width="2"/>
<line x1="533.9" y1="110" x2="533.9" y2="126" stroke="#1f2937" stroke-width="2"/>
<circle cx="520.1" cy="118" r="6" fill="#1f2937"/>
<text x="545.9" y="123" class="small">0.834 ms</text>
<text x="127" y="180" text-anchor="end" class="label">S2</text>
<line x1="574.6" y1="175" x2="606.6" y2="175" stroke="#0072B2" stroke-width="3"/>
<line x1="574.6" y1="167" x2="574.6" y2="183" stroke="#0072B2" stroke-width="2"/>
<line x1="606.6" y1="167" x2="606.6" y2="183" stroke="#0072B2" stroke-width="2"/>
<circle cx="590.1" cy="175" r="6" fill="#0072B2"/>
<text x="618.6" y="180" class="small">0.989 ms</text>
<text x="127" y="237" text-anchor="end" class="label">S3</text>
<line x1="746.7" y1="232" x2="837.0" y2="232" stroke="#D55E00" stroke-width="3"/>
<line x1="746.7" y1="224" x2="746.7" y2="240" stroke="#D55E00" stroke-width="2"/>
<line x1="837.0" y1="224" x2="837.0" y2="240" stroke="#D55E00" stroke-width="2"/>
<circle cx="791.3" cy="232" r="6" fill="#D55E00"/>
<text x="849.0" y="237" class="small">1.436 ms</text>
<text x="127" y="294" text-anchor="end" class="label">S4</text>
<line x1="693.4" y1="289" x2="802.0" y2="289" stroke="#009E73" stroke-width="3"/>
<line x1="693.4" y1="281" x2="693.4" y2="297" stroke="#009E73" stroke-width="2"/>
<line x1="802.0" y1="281" x2="802.0" y2="297" stroke="#009E73" stroke-width="2"/>
<circle cx="735.2" cy="289" r="6" fill="#009E73"/>
<text x="814.0" y="294" class="small">1.312 ms</text>
</svg>
